<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#4f6ef7">
  <title>拍照识别 · 乐玩魔方</title>
  <link rel="icon" href="images/icon.png" type="image/png">
  <link rel="stylesheet" href="css/styles.css">
  <script src="js/cube.js"></script>
  <script src="js/app.js"></script>
  <script src="js/input.js"></script>
  <script src="js/camera.js"></script>
</head>
<body>
  <div class="page">
    <nav class="nav-bar">
      <a class="nav-back" href="index.html" aria-label="返回">‹</a>
      <span class="nav-title">拍照识别</span>
      <button class="nav-action" id="skipBtn" type="button">跳过</button>
    </nav>

    <!-- 第一步：拍照取色 -->
    <section id="capturePhase">
      <div class="card">
        <div class="card-head">
          <h2 class="card-title">对准魔方</h2>
          <span class="pill" id="captureFaceName">上面 (U)</span>
        </div>

        <div class="camera-area" id="cameraArea">
          <video id="video" autoplay playsinline muted></video>
          <div class="overlay-grid" id="overlayGrid">
            <div class="ov-cell"></div><div class="ov-cell"></div><div class="ov-cell"></div>
            <div class="ov-cell"></div><div class="ov-center"></div><div class="ov-cell"></div>
            <div class="ov-cell"></div><div class="ov-cell"></div><div class="ov-cell"></div>
          </div>
        </div>

        <p class="hint">让九宫格正好罩住魔方的这一面，取景框会实时显示识别到的颜色。光线均匀一点会更准。</p>

        <div class="card-head" style="margin-top:14px"><h2 class="card-title">当前在拍</h2></div>
        <div class="face-chips" id="faceChips"></div>

        <div class="actions">
          <button class="btn-primary" id="captureBtn" type="button">识别这一面</button>
          <div class="action-row">
            <button class="btn-ghost" id="skipBtn2" type="button">不用拍照，直接手填</button>
          </div>
        </div>
      </div>
    </section>

    <!-- 第二步：核对并求解（与手动填色共用同一套输入组件） -->
    <section id="fillPhase" style="display:none">
      <div class="card">
        <div class="card-head">
          <h2 class="card-title">核对颜色</h2>
          <span class="pill" id="cubeProgress">已填 0 / 6 面</span>
        </div>
        <div class="progress-track"><div class="progress-fill" id="cubeProgressBar"></div></div>

        <div class="net" id="net"></div>

        <p class="hint">识别不准的格子可以直接改：选个颜色，再点格子覆盖掉。</p>
        <p class="input-hint" id="inputHint"></p>
      </div>

      <section class="card">
        <div class="card-head"><h2 class="card-title">选颜色</h2><span class="card-sub">选中后在上方点格子</span></div>
        <div class="palette" id="palette"></div>
      </section>

      <section class="card">
        <div class="card-head"><h2 class="card-title">立体预览</h2><span class="card-sub">可拖动旋转</span></div>
        <div class="cube-scene" id="cubeScene"><div class="cube" id="cube3d"></div></div>
      </section>

      <div class="actions">
        <button class="btn-primary" id="solveBtn" type="button" disabled>开始求解</button>
        <div class="action-row">
          <button class="btn-ghost" id="resetBtn" type="button">全部清空</button>
        </div>
      </div>
    </section>
  </div>

  <div class="toast" id="toast"></div>

  <script>
    window.CubeInput.init({ mode: 'camera' });
    window.CubeCamera.init();
    var skip2 = document.getElementById('skipBtn2');
    if (skip2) skip2.addEventListener('click', function () {
      window.CubeCamera.stop();
      document.getElementById('capturePhase').style.display = 'none';
      document.getElementById('fillPhase').style.display = 'block';
      window.CubeInput.refresh();
      window.scrollTo(0, 0);
    });
  </script>
</body>
</html>
