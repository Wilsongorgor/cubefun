<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#4f6ef7">
  <title>手动填色 · 乐玩魔方</title>
  <link rel="icon" href="images/icon.png" type="image/png">
  <link rel="stylesheet" href="css/styles.css">
  <script src="js/cube.js"></script>
  <script src="js/app.js"></script>
  <script src="js/input.js"></script>
</head>
<body>
  <div class="page">
    <nav class="nav-bar">
      <a class="nav-back" href="index.html" aria-label="返回">‹</a>
      <span class="nav-title">手动填色</span>
      <button class="nav-action" id="resetBtn" type="button">清空</button>
    </nav>

    <section class="card">
      <div class="card-head">
        <h2 class="card-title">六面展开图</h2>
        <span class="pill" id="cubeProgress">已填 0 / 6 面</span>
      </div>
      <div class="progress-track"><div class="progress-fill" id="cubeProgressBar"></div></div>

      <div class="net" id="net"></div>

      <p class="hint">展开图 = 魔方拆开摊平：上面在上、下面在下，中间一圈是 左·前·右·后。照着手里的魔方，一格一格点出来。</p>
      <p class="input-hint" id="inputHint"></p>
    </section>

    <section class="card">
      <div class="card-head"><h2 class="card-title">选颜色</h2><span class="card-sub">选中后在上方点格子</span></div>
      <div class="palette" id="palette"></div>
    </section>

    <section class="card">
      <div class="card-head"><h2 class="card-title">立体预览</h2><span class="card-sub">可拖动旋转</span></div>
      <div class="cube-scene" id="cubeScene"><div class="cube" id="cube3d"></div></div>
      <p class="hint">点立体图上的某个面，可以在展开图里高亮它。</p>
    </section>

    <div class="actions">
      <button class="btn-primary" id="solveBtn" type="button" disabled>开始求解</button>
      <div class="action-row">
        <button class="btn-ghost" id="scrambleBtn" type="button">随机打乱（试玩）</button>
      </div>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <script>
    window.CubeInput.init({ mode: 'manual' });
  </script>
</body>
</html>
