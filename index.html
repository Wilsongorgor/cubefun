<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#4f6ef7">
  <meta name="description" content="乐玩魔方 — 拍照识别或手动填色，自动算出三阶魔方还原步骤。">
  <title>乐玩魔方 · 三阶魔方还原助手</title>
  <link rel="icon" href="images/icon.png" type="image/png">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <div class="page home">
    <header class="hero">
      <img src="images/icon.png" class="hero-icon" alt="乐玩魔方">
      <h1 class="hero-title">乐玩魔方</h1>
      <p class="hero-sub">把六面颜色告诉我，还你一个复原的魔方</p>
    </header>

    <section class="mode-list">
      <a class="mode-card" href="camera.html">
        <span class="mode-icon">📷</span>
        <span class="mode-body">
          <span class="mode-title">拍照识别</span>
          <span class="mode-desc">对准魔方，自动读出九宫格颜色</span>
        </span>
        <span class="mode-arrow">›</span>
      </a>
      <a class="mode-card" href="manual.html">
        <span class="mode-icon">✍️</span>
        <span class="mode-body">
          <span class="mode-title">手动填色</span>
          <span class="mode-desc">在六面展开图上点格子填色</span>
        </span>
        <span class="mode-arrow">›</span>
      </a>
    </section>

    <section class="tips">
      <h2 class="tips-title">怎么填才不会错</h2>
      <ol class="tips-list">
        <li>先确定一个「前面」，整个过程中魔方不要再整体翻转。</li>
        <li>展开图就是魔方拆开摊平的样子：<b>上面</b>在上方，<b>下面</b>在下方，中间一圈依次是 <b>左·前·右·后</b>。</li>
        <li>每个面的中心块决定了这一面最终的颜色，六个中心颜色必须互不相同。</li>
      </ol>
    </section>

    <footer class="foot">纯前端运行 · 使用 Kociemba 两阶段算法 · 平均 20 步左右</footer>
  </div>
</body>
</html>
