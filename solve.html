<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#4f6ef7">
  <title>还原步骤 · 乐玩魔方</title>
  <link rel="icon" href="images/icon.png" type="image/png">
  <link rel="stylesheet" href="css/styles.css">
  <script src="js/cube.js"></script>
  <script src="js/app.js"></script>
  <script src="js/min2phase.js"></script>
  <script src="js/solver.js"></script>
  <script src="js/solve.js"></script>
</head>
<body>
  <div class="page">
    <nav class="nav-bar">
      <a class="nav-back" href="index.html" aria-label="返回">‹</a>
      <span class="nav-title">还原步骤</span>
      <button class="nav-action" id="restartBtn" type="button">重看</button>
    </nav>

    <section class="state-panel" id="solvingSection">
      <div class="spinner"></div>
      <p class="state-title">正在求解…</p>
      <p class="state-sub">Kociemba 两阶段算法正在搜索解法</p>
    </section>

    <section class="state-panel" id="errorSection" style="display:none">
      <div class="state-emoji">⚠️</div>
      <p class="state-title">算不出解法</p>
      <p class="state-sub error" id="errorText"></p>
      <a class="btn-primary" href="manual.html">重新填色</a>
    </section>

    <section id="solutionSection" style="display:none">
      <div class="card">
        <div class="card-head">
          <h2 class="card-title" id="stepText">准备中…</h2>
          <span class="pill" id="stepPill">0 / 0</span>
        </div>
        <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>
        <p class="move-highlight" id="moveHighlight"></p>

        <div class="cube-scene" id="solveScene"><div class="cube" id="solveCube3d"></div></div>
        <p class="hint">拖动可旋转查看。黄色高亮的一面，就是这一步要转的面。</p>
      </div>

      <div class="actions" id="navButtons">
        <div class="action-row">
          <button class="btn-ghost" id="prevStepBtn" type="button">← 上一步</button>
          <button class="btn-primary" id="nextStepBtn" type="button">下一步 →</button>
        </div>
        <div class="action-row">
          <button class="btn-ghost" id="playBtn" type="button">▶ 自动播放</button>
        </div>
        <p class="hint">也可以直接用键盘 ← → 翻页，空格播放/暂停。</p>
      </div>

      <section class="card solved-card" id="solvedSection" style="display:none">
        <div class="state-emoji">🎉</div>
        <p class="state-title">魔方已复原</p>
        <p class="state-sub">照着做下来就对了，要不要再来一次？</p>
        <div class="actions">
          <a class="btn-primary" href="index.html">回到首页</a>
        </div>
      </section>
    </section>
  </div>

  <div class="toast" id="toast"></div>
</body>
</html>
